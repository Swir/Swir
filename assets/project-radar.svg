<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-label="SWIR neon signal board">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#010409"/>
      <stop offset="0.5" stop-color="#04101c"/>
      <stop offset="1" stop-color="#02070d"/>
    </linearGradient>
    <radialGradient id="coreGlow" cx="50%" cy="48%" r="48%">
      <stop offset="0" stop-color="#139cff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#139cff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#149bff" stroke-opacity="0.045"/>
    </pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="470" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="470" rx="24" fill="url(#grid)"/>
  <rect width="1200" height="470" rx="24" fill="url(#coreGlow)"/>
  <rect x="1" y="1" width="1198" height="468" rx="23" fill="none" stroke="#168cff" stroke-opacity="0.32"/>

  <text x="50" y="54" fill="#e8f7ff" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="800">SWIR SIGNAL BOARD</text>
  <text x="50" y="80" fill="#6ea8cb" font-family="Consolas, Menlo, monospace" font-size="13" letter-spacing="2">DEV • MUSIC • GAMES • AI • TOOLS • LIFE</text>
  <circle cx="1090" cy="56" r="5" fill="#38bdf8" filter="url(#glow)"><animate attributeName="opacity" values="1;.2;1" dur="2.2s" repeatCount="indefinite"/></circle>
  <text x="1104" y="61" fill="#82d7ff" font-family="Consolas, Menlo, monospace" font-size="12">ONLINE</text>

  <!-- Core -->
  <g transform="translate(600 246)">
    <circle r="132" fill="none" stroke="#168cff" stroke-opacity="0.10"/>
    <circle r="104" fill="none" stroke="#168cff" stroke-opacity="0.18" stroke-dasharray="5 10">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="34s" repeatCount="indefinite"/>
    </circle>
    <circle r="72" fill="#03101a" stroke="#22aaff" stroke-width="2" stroke-opacity="0.78"/>
    <g transform="translate(-36 -51)" fill="none" stroke="#6ed1ff" stroke-width="4" filter="url(#glow)">
      <path d="M0 24 L16 2 L34 24 L52 8 L72 24 L66 42 H6Z"/>
    </g>
    <text y="18" text-anchor="middle" fill="#ffffff" font-family="Arial Black, Arial, sans-serif" font-size="26" font-weight="900">SWIR</text>
    <text y="43" text-anchor="middle" fill="#3ab8ff" font-family="Consolas, Menlo, monospace" font-size="11" letter-spacing="2">BUILD CORE</text>
  </g>

  <!-- Connections -->
  <g stroke="#159dff" stroke-opacity="0.27" fill="none">
    <path d="M548 196 L333 138"/>
    <path d="M652 196 L867 138"/>
    <path d="M522 246 L310 246"/>
    <path d="M678 246 L890 246"/>
    <path d="M548 300 L337 363"/>
    <path d="M652 300 L863 363"/>
  </g>

  <!-- Six avatar-inspired lanes -->
  <g font-family="Arial, Helvetica, sans-serif">
    <g transform="translate(115 100)"><rect width="230" height="74" rx="14" fill="#05131f" stroke="#178cff"/><circle cx="26" cy="25" r="6" fill="#35b9ff" filter="url(#glow)"/><text x="45" y="30" fill="#edf9ff" font-size="17" font-weight="800">DEV</text><text x="45" y="54" fill="#729db8" font-size="12">Python • apps • Windows</text></g>
    <g transform="translate(855 100)"><rect width="230" height="74" rx="14" fill="#05131f" stroke="#178cff"/><circle cx="26" cy="25" r="6" fill="#35b9ff" filter="url(#glow)"/><text x="45" y="30" fill="#edf9ff" font-size="17" font-weight="800">MUSIC</text><text x="45" y="54" fill="#729db8" font-size="12">creative tech • audio workflows</text></g>
    <g transform="translate(88 209)"><rect width="230" height="74" rx="14" fill="#05131f" stroke="#178cff"/><circle cx="26" cy="25" r="6" fill="#35b9ff" filter="url(#glow)"/><text x="45" y="30" fill="#edf9ff" font-size="17" font-weight="800">GAMES</text><text x="45" y="54" fill="#729db8" font-size="12">Unity • gameplay • releases</text></g>
    <g transform="translate(882 209)"><rect width="230" height="74" rx="14" fill="#05131f" stroke="#178cff"/><circle cx="26" cy="25" r="6" fill="#35b9ff" filter="url(#glow)"/><text x="45" y="30" fill="#edf9ff" font-size="17" font-weight="800">AI</text><text x="45" y="54" fill="#729db8" font-size="12">experiments • agents • tooling</text></g>
    <g transform="translate(115 326)"><rect width="230" height="74" rx="14" fill="#05131f" stroke="#178cff"/><circle cx="26" cy="25" r="6" fill="#35b9ff" filter="url(#glow)"/><text x="45" y="30" fill="#edf9ff" font-size="17" font-weight="800">TOOLS</text><text x="45" y="54" fill="#729db8" font-size="12">automation • utilities • CI</text></g>
    <g transform="translate(855 326)"><rect width="230" height="74" rx="14" fill="#05131f" stroke="#178cff"/><circle cx="26" cy="25" r="6" fill="#35b9ff" filter="url(#glow)"/><text x="45" y="30" fill="#edf9ff" font-size="17" font-weight="800">LIFE</text><text x="45" y="54" fill="#729db8" font-size="12">build • learn • improve • repeat</text></g>
  </g>

  <text x="600" y="445" text-anchor="middle" fill="#7dcfff" font-family="Consolas, Menlo, monospace" font-size="13" letter-spacing="3">IDEAS → CODE → REALITY</text>
</svg>