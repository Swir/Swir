<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="SWIR electric horror mask hero v2">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#010205"/><stop offset=".48" stop-color="#04111d"/><stop offset="1" stop-color="#010307"/></linearGradient>
  <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f4fdff"/><stop offset=".45" stop-color="#7eeaff"/><stop offset="1" stop-color="#1aa6ff"/></linearGradient>
