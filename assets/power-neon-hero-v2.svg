  <filter id="g" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="gg" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="12" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#2acbff" stroke-opacity=".045"/></pattern>
</defs>
<rect width="1280" height="360" rx="24" fill="url(#bg)"/><rect width="1280" height="360" rx="24" fill="url(#grid)"/><rect x="1.5" y="1.5" width="1277" height="357" rx="22" fill="none" stroke="#168fff" stroke-opacity=".42"/>
<ellipse cx="285" cy="315" rx="320" ry="70" fill="url(#fog)"><animate attributeName="rx" values="290;340;290" dur="7s" repeatCount="indefinite"/></ellipse>
<ellipse cx="880" cy="285" rx="430" ry="75" fill="url(#fog)"><animate attributeName="cx" values="830;930;830" dur="10s" repeatCount="indefinite"/></ellipse>

