<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="SWIR developer profile banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#02060c"/>
      <stop offset="0.55" stop-color="#07111d"/>
      <stop offset="1" stop-color="#02070d"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0b68b8" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#2aaeff"/>
      <stop offset="1" stop-color="#0b68b8" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="300" rx="22" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="298" rx="21" fill="none" stroke="#163955" stroke-width="2"/>

  <g transform="translate(70 53)">
    <g fill="none" stroke="#36b8ff" stroke-width="3.5" stroke-linejoin="round" filter="url(#glow)">
      <path d="M0 28 L18 4 L36 28 L54 10 L72 28 L66 46 H6 Z"/>
    </g>
    <text x="0" y="120" fill="#f4f8fb" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="86" font-weight="900" letter-spacing="8">SWIR</text>
    <text x="4" y="156" fill="#69c9ff" font-family="Consolas, Menlo, monospace" font-size="18" letter-spacing="4">DEVELOPER • CREATOR • BUILDER</text>
    <text x="4" y="192" fill="#90a8b8" font-family="Consolas, Menlo, monospace" font-size="15" letter-spacing="2">IDEAS → CODE → REALITY</text>
  </g>

  <g transform="translate(875 150)">
    <circle r="84" fill="none" stroke="#1b75b6" stroke-width="2"/>
    <circle r="67" fill="#04101b" stroke="#2aaeff" stroke-width="2" opacity="0.95"/>
    <g stroke="#45c0ff" stroke-width="6" stroke-linecap="round" filter="url(#glow)">
      <path d="M-36 -24 L-16 -4 M-16 -24 L-36 -4"/>
      <path d="M16 -24 L36 -4 M36 -24 L16 -4"/>
    </g>
    <path d="M-31 25 C-16 39 16 39 31 25" fill="none" stroke="#45c0ff" stroke-width="4" stroke-linecap="round"/>
  </g>

  <g transform="translate(1010 92)">
    <text x="0" y="0" fill="#79d0ff" font-family="Consolas, Menlo, monospace" font-size="14" letter-spacing="2">BETTER</text>
    <text x="0" y="25" fill="#cfefff" font-family="Consolas, Menlo, monospace" font-size="14" letter-spacing="2">THAN</text>
    <text x="0" y="50" fill="#79d0ff" font-family="Consolas, Menlo, monospace" font-size="14" letter-spacing="2">YESTERDAY</text>
  </g>

  <rect x="70" y="258" width="1060" height="2" rx="1" fill="url(#line)"/>
</svg>