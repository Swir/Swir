    <text x="10" y="198" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="800" fill="#F6FCFF">BUILD WHAT SHOULD EXIST.</text>
    <text x="10" y="230" font-family="Consolas,Menlo,monospace" font-size="13.5" letter-spacing="2.2" fill="#7A97A9">POWER / CODE / RELEASE / EVOLVE / REPEAT</text>
    <g transform="translate(10,274)" font-family="Consolas,Menlo,monospace" font-size="12.5" fill="#5CE1FF"><text x="0" y="0">PYTHON</text><text x="101" y="0">WINDOWS</text><text x="220" y="0">ANDROID</text><text x="336" y="0">WEB</text><text x="412" y="0">TOOLS</text><text x="498" y="0">FFMPEG</text><text x="603" y="0">AUTOMATION</text></g>
