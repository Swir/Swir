  <g opacity="0.24" fill="#93EEFF"><rect x="412" y="42" width="454" height="2"><animate attributeName="x" values="412;470;392;412" dur="4.8s" repeatCount="indefinite"/></rect><rect x="718" y="318" width="250" height="1.5"><animate attributeName="width" values="90;250;145;250" dur="4.1s" repeatCount="indefinite"/></rect><rect x="520" y="152" width="132" height="1"><animate attributeName="opacity" values="0;0.8;0;0" dur="2.9s" repeatCount="indefinite"/></rect></g>
  <text x="1170" y="331" text-anchor="end" font-family="Consolas,Menlo,monospace" font-size="11" letter-spacing="2" fill="#4AD4FF" opacity="0.5">SIGNAL // OVERCHARGED</text>
