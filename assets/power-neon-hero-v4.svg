    <path d="M1184 93 L1136 117 L1158 143 L1104 166 L1128 196 L1072 220" stroke="#31DBFF" stroke-width="3.5" stroke-dasharray="15 10"><animate attributeName="stroke-dashoffset" values="0;130" dur="1.55s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.18;1;0.2;0.9;0.18" dur="2.3s" repeatCount="indefinite"/></path>
    <path d="M1118 58 L1087 80 L1098 99 L1062 116 L1078 135" stroke="#6B84FF" stroke-width="2.8" stroke-dasharray="12 8"><animate attributeName="stroke-dashoffset" values="0;-90" dur="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.08;0.75;0.15;0.6;0.08" dur="3s" repeatCount="indefinite"/></path>
