    <text x="0" y="92" font-family="Arial Black,Segoe UI,Arial,sans-serif" font-size="132" font-style="italic" font-weight="900" letter-spacing="8" fill="url(#txt)" filter="url(#bigglow)">SWIR</text>
    <text x="10" y="128" font-family="Consolas,Menlo,monospace" font-size="18" letter-spacing="4" fill="#7DEBFF">SOFTWARE · AUTOMATION · GAMES · AI</text>
