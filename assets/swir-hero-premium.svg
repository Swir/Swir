<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="SWIR — software, tools, games and automation">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080b12"/>
      <stop offset="0.52" stop-color="#0c1422"/>
      <stop offset="1" stop-color="#070a10"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6ee7ff"/>
      <stop offset="0.48" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#2563eb" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>
  <ellipse cx="930" cy="60" rx="260" ry="180" fill="url(#glow)" filter="url(#soft)"/>
  <ellipse cx="220" cy="310" rx="250" ry="130" fill="url(#glow)" opacity="0.55" filter="url(#soft)"/>

  <rect x="36" y="36" width="1128" height="248" rx="20" fill="#ffffff" fill-opacity="0.018" stroke="#ffffff" stroke-opacity="0.09"/>

  <g transform="translate(78 70)">
    <rect x="0" y="0" width="6" height="176" rx="3" fill="url(#accent)"/>

    <text x="34" y="38" fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" letter-spacing="5">BUILDING USEFUL THINGS</text>
    <text x="30" y="116" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="86" font-weight="800" letter-spacing="-3">SWIR</text>
    <text x="34" y="158" fill="#cbd5e1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="400">Software · Tools · Games · Automation</text>
    <text x="34" y="194" fill="#64748b" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">Python / Windows / Android / Web / AI experiments</text>
  </g>

  <g transform="translate(865 104)">
    <circle cx="88" cy="56" r="72" fill="none" stroke="#ffffff" stroke-opacity="0.06"/>
    <circle cx="88" cy="56" r="52" fill="none" stroke="url(#accent)" stroke-width="2" stroke-opacity="0.55"/>
    <path d="M58 56h60M88 26v60" stroke="#60a5fa" stroke-width="2" stroke-opacity="0.45"/>
    <circle cx="88" cy="56" r="7" fill="#f8fafc"/>
    <circle cx="88" cy="56" r="3" fill="#3b82f6"/>
    <text x="88" y="159" text-anchor="middle" fill="#64748b" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="600" letter-spacing="3">BUILD · SHIP · IMPROVE</text>
  </g>

  <rect x="78" y="275" width="1044" height="2" rx="1" fill="url(#accent)" opacity="0.58"/>
</svg>
