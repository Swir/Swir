<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">SWIR README PRO v2 project hero template</title>
  <desc id="desc">Dark electric-cyan SWIR project banner template with editable project name, tagline and category line.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#02050A"/>
      <stop offset="0.55" stop-color="#06101A"/>
      <stop offset="1" stop-color="#02050A"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0088FF"/>
      <stop offset="0.45" stop-color="#62E5FF"/>
      <stop offset="1" stop-color="#0088FF"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#62E5FF" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" rx="26" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="318" rx="25" fill="none" stroke="#62E5FF" stroke-opacity="0.25"/>
  <rect width="1200" height="320" rx="26" fill="url(#grid)"/>

  <path d="M0 250 C180 210 250 300 430 258 S720 214 885 248 S1070 282 1200 232" fill="none" stroke="url(#cyan)" stroke-opacity="0.24" stroke-width="2"/>
  <path d="M780 45 L1180 45" stroke="#62E5FF" stroke-opacity="0.14"/>
  <path d="M1000 70 L1180 70" stroke="#0088FF" stroke-opacity="0.2"/>

  <!-- Replace this mark with the project's real icon or a project-specific symbol. -->
  <g transform="translate(72 74)">
    <rect width="150" height="150" rx="30" fill="#07111C" stroke="#62E5FF" stroke-opacity="0.5"/>
    <path d="M40 80 L72 48 L104 80 L72 112 Z" fill="none" stroke="#62E5FF" stroke-width="7" filter="url(#glow)"/>
    <circle cx="104" cy="48" r="8" fill="#0088FF" filter="url(#glow)"/>
  </g>

  <text x="270" y="70" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="4" fill="#62E5FF">SWIR PROJECT</text>

  <!-- Replace placeholders before use. -->
  <text x="270" y="145" font-family="Segoe UI, Arial, sans-serif" font-size="58" font-weight="800" fill="#F4FAFF">PROJECT NAME</text>
  <text x="272" y="190" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="500" fill="#B8D2E0">Short project tagline goes here</text>
  <text x="272" y="232" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="650" letter-spacing="1.5" fill="#62E5FF">CATEGORY  •  PLATFORM  •  PRIMARY USE CASE</text>

  <g transform="translate(1015 242)">
    <circle cx="0" cy="0" r="4" fill="#62E5FF" filter="url(#glow)"/>
    <circle cx="25" cy="0" r="4" fill="#0088FF"/>
    <circle cx="50" cy="0" r="4" fill="#62E5FF" opacity="0.5"/>
  </g>
</svg>
