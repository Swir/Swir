name: Profile animation diagnostics

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/profile-animation-diagnostics.yml'

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Archive public animation sources and current assets
        uses: actions/upload-artifact@v4
        with:
          name: profile-animation-diagnostics
          retention-days: 3
          include-hidden-files: true
          path: |
            README.md
            scripts/generate_pixel_tank_patrol.py
            scripts/generate_profile_activity.py
            tests/test_pixel_tank_patrol.py
            docs/PIXEL_TANK_PATROL.md
            .github/workflows/profile-activity.yml
            assets/github-pixel-tank-patrol.svg
            assets/pixel-tank-state.json
