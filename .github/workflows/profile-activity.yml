name: Profile Activity - Moon Patrol

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/profile-activity.yml"
      - "scripts/generate_moon_patrol.py"
      - "scripts/generate_profile_activity.py"
      - "tests/test_moon_patrol.py"

permissions:
  contents: write

concurrency:
  group: profile-activity-live
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Moon Patrol renderer and contribution metrics
        run: python3 -m unittest discover -s tests -p 'test_moon_patrol.py' -v

      - name: Generate animated patrol and existing activity dashboard
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USER: ${{ github.repository_owner }}
        run: python3 scripts/generate_moon_patrol.py

      - name: Publish validated profile assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- assets/github-moon-patrol.svg assets/github-activity-live.svg assets/moon-patrol-state.json
          if git diff --cached --quiet; then
            echo "Contribution snapshot unchanged; no commit needed."
            exit 0
          fi
          git commit -m "chore(profile): sync Moon Patrol contribution snapshot [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done
          echo "Could not publish without overwriting concurrent changes."
          exit 1
