name: Profile Activity - Robot Arm Factory

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/profile-activity.yml"
      - "scripts/generate_robot_arm_factory.py"
      - "scripts/generate_profile_activity.py"
      - "scripts/check_robot_arm_motion.py"
      - "tests/test_robot_arm_factory.py"

permissions:
  contents: write

concurrency:
  group: profile-activity-live
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test contribution mapping and factory animation
        run: python3 -m unittest discover -s tests -p 'test_robot_arm_factory.py' -v

      - name: Generate Robot Arm Factory and activity dashboard
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USER: ${{ github.repository_owner }}
        run: python3 scripts/generate_robot_arm_factory.py

      - name: Install browser regression dependencies
        if: github.event_name != 'schedule'
        run: |
          python3 -m pip install playwright==1.57.0 Pillow==12.3.0
          python3 -m playwright install --with-deps chromium

      - name: Verify arm motion, pickup, deploy and infinite loop
        if: github.event_name != 'schedule'
        run: python3 scripts/check_robot_arm_motion.py

      - name: Upload factory animation evidence
        if: always() && github.event_name != 'schedule'
        uses: actions/upload-artifact@v4
        with:
          name: robot-arm-factory-motion-evidence
          retention-days: 7
          if-no-files-found: error
          path: |
            robot-motion-evidence/
            assets/github-robot-arm-factory-live.svg
            assets/github-robot-arm-factory-still.svg
            assets/robot-arm-factory-state.json

      - name: Publish validated profile assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- assets/github-robot-arm-factory-live.svg assets/github-robot-arm-factory-still.svg assets/github-activity-live.svg assets/robot-arm-factory-state.json
          if git diff --cached --quiet; then
            echo "Factory data and renderer unchanged; no commit needed."
            exit 0
          fi
          git commit -m "chore(profile): sync Robot Arm Factory contribution snapshot [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done
          echo "Could not publish without overwriting concurrent changes."
          exit 1
