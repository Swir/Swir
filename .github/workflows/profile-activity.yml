name: Profile Activity

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/profile-activity.yml"
      - "scripts/generate_profile_activity.py"

permissions:
  contents: write

concurrency:
  group: profile-activity-live
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate GitHub activity dashboard
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USER: ${{ github.repository_owner }}
        run: python3 scripts/generate_profile_activity.py

      - name: Publish refreshed activity dashboard
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- assets/github-activity-live.svg
          if git diff --cached --quiet; then
            echo "Activity dashboard is already current."
            exit 0
          fi
          git commit -m "chore(profile): refresh GitHub activity dashboard [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done
          echo "Could not publish without overwriting concurrent changes."
          exit 1
