name: Generate SWIR contribution snake

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%2300A6FF&color_dots=%23EBEDF0,%23074B6F,%230078B0,%2300A6FF,%2368D8FF
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%2300A6FF&color_dots=%23161B22,%23052A3D,%2300557A,%230088CC,%2300C8FF

      - name: Publish snake to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
